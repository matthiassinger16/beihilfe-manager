beihilfe:
  # Holds the database and the uploaded scans; override with BEIHILFE_DATA_DIR.
  data-dir: ${BEIHILFE_DATA_DIR:./data}

server:
  mime-mappings:
    webmanifest: application/manifest+json

spring:
  application:
    name: beihilfe-manager
  datasource:
    url: jdbc:h2:file:${beihilfe.data-dir}/beihilfe
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
