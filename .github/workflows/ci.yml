name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Builds and tests backend and frontend; Gradle downloads the pinned Node.js itself.
      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: beihilfe-manager
          path: backend/build/libs/backend-*-SNAPSHOT.jar
          if-no-files-found: error
